name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  banco:
    name: Schema do banco
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplica infra/db/schema.sql
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/db/schema.sql
        env:
          PGPASSWORD: ci

  contratos:
    name: Contratos de mensagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r packages/contracts/requirements-dev.txt
      - run: pytest -q packages/contracts

  web:
    name: Aplicação web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  inferencia:
    name: Serviço de inferência
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monta a imagem
        run: docker build -f services/inference/Dockerfile -t histolente-inference:ci .
      - name: Testes (inclui o de arquitetura do RNF06)
        run: >
          docker run --rm -u 0 -v "$PWD:/repo:ro" -w /repo/services/inference histolente-inference:ci
          sh -c "pip install -q --root-user-action=ignore -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider"

  ambiente:
    name: Ambiente completo e teste de fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe infraestrutura, web, consumidor e inferência
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml --profile app up -d --build --wait
      - name: Testes do ambiente
        run: docker compose -f infra/docker-compose.yml --profile teste run --rm verificador
      - name: Teste de fumaça (cadastro, termo, análise, SSE, cache, isolamento)
        run: >
          docker compose -f infra/docker-compose.yml --profile teste run --rm -e WEB_URL=http://web:3000 verificador
          sh -c "pip install -q --root-user-action=ignore pytest==8.3.3 && python -m pytest -q -s -p no:cacheprovider tests/fumaca"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile app logs --tail=200
      - name: Derruba
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile app down -v

  ml:
    name: Pipeline de ML
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - name: Instala PyTorch (CPU) e dependências
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  ferramentas:
    name: Ferramentas de documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila scripts
        run: python -m py_compile tools/*.py
      - name: Gera diagramas
        run: python -I tools/diagramas.py
