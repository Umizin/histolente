name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  banco:
    name: Schema do banco
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplica infra/db/schema.sql
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/db/schema.sql
        env:
          PGPASSWORD: ci

  contratos:
    name: Contratos de mensagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r packages/contracts/requirements-dev.txt
      - run: pytest -q packages/contracts

  ambiente:
    name: Ambiente Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe Postgres, Redis e RabbitMQ
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml up -d --wait
      - name: Testes de ponta a ponta do ambiente
        run: docker compose -f infra/docker-compose.yml --profile teste run --rm verificador
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200
      - name: Derruba
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  ferramentas:
    name: Ferramentas de documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila scripts
        run: python -m py_compile tools/*.py
      - name: Gera diagramas
        run: python -I tools/diagramas.py
