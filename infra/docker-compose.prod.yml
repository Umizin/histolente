# Produção (demonstração): usa as imagens publicadas pelo CD no GHCR em vez de montar localmente.
#
#   docker login ghcr.io -u <usuario>          # token com read:packages (o repositório é privado)
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --profile app --profile publicar up -d --wait
#
# - watchtower: verifica o GHCR a cada 5 min e atualiza web, consumidor e inferência (entrega contínua)
# - tunel: Cloudflare Tunnel com TUNNEL_TOKEN (endereço fixo do domínio configurado no painel da Cloudflare)
# - tunel-rapido (perfil publicar-rapido): túnel temporário *.trycloudflare.com, sem conta; o endereço muda a cada início
# Nenhuma porta é aberta no roteador: o túnel sai da máquina para a Cloudflare.

x-atualizavel: &atualizavel
  labels:
    com.centurylinklabs.watchtower.enable: "true"

services:
  web:
    <<: *atualizavel
    build: !reset null
    image: ghcr.io/umizin/histolente-web:latest
    environment:
      COOKIE_SECURE: "true"
    ports: !reset []

  consumidor:
    <<: *atualizavel
    build: !reset null
    image: ghcr.io/umizin/histolente-web:latest

  inference:
    <<: *atualizavel
    build: !reset null
    image: ghcr.io/umizin/histolente-inference:latest

  watchtower:
    profiles: [publicar, publicar-rapido]
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro   # credencial do GHCR
    networks: []

  tunel:
    profiles: [publicar]
    image: cloudflare/cloudflared:2024.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # obrigatório no perfil publicar
    depends_on:
      web: { condition: service_healthy }
    networks: [frontend_net]

  tunel-rapido:
    profiles: [publicar-rapido]
    image: cloudflare/cloudflared:2024.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:3000
    depends_on:
      web: { condition: service_healthy }
    networks: [frontend_net]
